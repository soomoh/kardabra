<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kardabra — a private, on-device credit-card statement tracker."
    />
    <title>Kardabra</title>
    <script>
      // Theme before first paint, so dark mode never flashes light. The
      // choice is mirrored from the settings store by src/lib/theme.ts
      // (keep the key and event name in step); "system" follows the OS live.
      (function () {
        var root = document.documentElement;
        var dark = matchMedia('(prefers-color-scheme: dark)');
        var choice = 'system';
        try {
          choice = localStorage.getItem('kardabra-theme') || choice;
        } catch (e) {}
        function apply() {
          root.dataset.theme =
            choice === 'light' || choice === 'dark'
              ? choice
              : dark.matches
                ? 'dark'
                : 'light';
        }
        apply();
        dark.addEventListener('change', apply);
        addEventListener('kardabra-theme', function (event) {
          choice = event.detail;
          apply();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
